<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Do Gab</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f8f1e9;
            color: #4a3b32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #e0d5c1;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .details {
            margin: 25px 0;
            text-align: left;
            background: #faf7f2;
            padding: 15px 20px;
            border-radius: 8px;
        }
        .details p { margin: 8px 0; }
        .btn-confirm {
            display: inline-block;
            background-color: #8c6d58;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Você está convidada!</h1>
        <p>Gostaria muito da sua companhia para um encontro especial.</p>

        <!-- ADICIONE ESTA LINHA DENTRO DO CONTAINER OU LOGO ABAIXO -->
        <p class="credits">Feito com ❤️ por Gabriel</p>
    </div>
        <div class="details">
            <p>📍 <strong>Lugar:</strong>Cinemna</p>
            <p>📅 <strong>Data:</strong> Sábado</p>
            <p>⏰ <strong>Horário:</strong>A Sua Escolha</p>
        </div>

        <!-- Substitua o número abaixo pelo seu WhatsApp -->

        <!-- Conteúdo do card aqui -->

</body>
</html>
